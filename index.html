<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이음 | 나만의 공간, 우리의 연결</title><style>
:root{--sky:#e6f5ff;--blue:#2382bf;--navy:#164e7a;--ink:#203d54;--muted:#66849a;--line:#d6eaf8;--white:#fff;--pale:#f4faff;--danger:#b83232}*{box-sizing:border-box}body{margin:0;background:#f4f8fb;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:960px;margin:28px auto;padding:0 16px}.shell{background:var(--sky);border:1px solid #c4e5fa;border-radius:24px;padding:18px;box-shadow:0 12px 40px #194b6a12}.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}.logo{width:46px;height:46px;border-radius:14px;background:white;display:grid;place-items:center;color:var(--blue);font-size:25px}.brand h1{margin:0;color:var(--navy);font-size:26px}.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}.tabs{display:flex;gap:10px;margin-bottom:16px}.tabs button{flex:1}.panel{background:white;border-radius:18px;padding:22px;border:1px solid var(--line)}h2{color:var(--navy);margin:0 0 14px;font-size:21px}h3{color:var(--navy);margin:18px 0 10px;font-size:16px}p{line-height:1.65}.muted{color:var(--muted);font-size:13px}.btn{border:1px solid transparent;border-radius:11px;padding:11px 14px;background:var(--blue);color:white;font-weight:700;cursor:pointer;font-size:14px}.btn:hover{filter:brightness(.97)}.btn.secondary{background:white;border-color:#bfdced;color:var(--navy)}.btn.danger{background:#b83232}.btn:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1}.field{width:100%;padding:12px;border:1px solid #cfe2ef;border-radius:10px;font:inherit;background:#fff;color:var(--ink)}textarea.field{resize:vertical}.stack{display:grid;gap:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{border:1px solid var(--line);background:#f7fbfe;border-radius:13px;padding:14px;cursor:pointer;color:var(--navy);font-weight:650;text-align:left}.tile.active{background:#d9efff;border-color:var(--blue)}.counter{display:flex;align-items:center;gap:12px}.counter button{padding:6px 12px}.number{font-size:20px;font-weight:800;color:var(--navy);min-width:24px;text-align:center}.stat{background:#edf7ff;border-radius:13px;padding:14px}.stat strong{display:block;color:var(--navy);font-size:22px}.notice{padding:14px;background:var(--pale);border-radius:12px}.warn{background:#fff4f4;border:1px solid #f4c6c6;border-radius:13px;padding:14px}.choice{display:block;width:100%;text-align:left;background:white;border:1px solid var(--line);border-radius:10px;padding:11px;margin-top:8px;color:var(--navy);cursor:pointer}.choice.selected{border-color:var(--blue);background:#d9efff}.hidden{display:none!important}.pill{display:inline-block;background:#e5f4ff;color:#2375ac;border-radius:99px;padding:5px 9px;font-size:12px;font-weight:700}.footer{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:16px}@media(min-width:720px){.shell{padding:24px}.panel{padding:28px}.content-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}}@media(max-width:520px){.wrap{margin:10px auto;padding:0 8px}.shell{padding:12px;border-radius:18px}.panel{padding:16px}.brand h1{font-size:24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.footer{gap:10px;flex-wrap:wrap}}
</style></head><body><main class="wrap"><div class="shell"><header class="brand"><div class="logo">↗</div><div><h1>이음</h1><p>나만의 공간, 우리의 연결</p></div><span class="pill" style="margin-left:auto">미리보기</span></header><nav class="tabs"><button class="btn" id="userTab">◉ 사용자</button><button class="btn secondary" id="adminTab">▣ 관리자</button></nav><section id="app" class="panel"></section><footer class="footer"><span>이음 · 나만의 공간, 우리의 연결</span><span>Responsive Preview</span></footer></div></main><script>
const $=s=>document.querySelector(s);let S={view:'user',nickname:'',entered:false,admitted:false,waiting:true,admin:false,postType:'quiz',title:'오늘의 퀴즈',body:'우리의 첫 번째 퀴즈에 참여해 보세요!',texts:1,photos:1,questions:3,choices:4,submitted:false,answer:'',revealed:false,ended:false,users:[]};
function btn(label,fn,cls=''){return `<button class="btn ${cls}" data-action="${fn}">${label}</button>`}function counter(label,key,min,max){return `<div class="row between"><div class="grow"><b>${label}</b></div><div class="counter">${btn('−',`dec:${key}:${min}`,'secondary')}<span class="number">${S[key]}</span>${btn('+',`inc:${key}:${max}`,'secondary')}</div></div>`}
function render(){ $('#userTab').className='btn '+(S.view==='user'?'':'secondary');$('#adminTab').className='btn '+(S.view==='admin'?'':'secondary');let h='';if(S.ended){h=`<div class="stack" style="text-align:center;padding:20px"><div style="font-size:44px">⏳</div><h2>이음이 초기화되었어요</h2><p>잠시 대기해 주세요. 곧 입장이 시작됩니다.</p>${btn('미리보기 다시 시작','reset','secondary')}</div>`}
else if(S.view==='admin'&&!S.admin){h=`<h2>🔒 관리자 로그인</h2><p class="muted">관리자 비밀번호를 입력해 주세요.</p><form id="login" class="stack"><input class="field" id="pw" type="password" placeholder="비밀번호 입력" autocomplete="current-password">${btn('관리자 메뉴 열기','login')}</form><p class="muted">시안 전용 로그인입니다. 실제 사이트에는 서버 인증이 필요합니다.</p>`}
else if(S.view==='admin'){h=`<h2>▦ 관리자 대시보드</h2><div class="grid"><div class="stat">👥<strong>${S.users.length}</strong><span class="muted">접속 중</span></div><div class="stat">▤<strong>${S.title?1:0}</strong><span class="muted">현재 게시물</span></div></div><h3>게시물 만들기</h3><div class="grid">${[['quiz','🧠 퀴즈'],['post','▤ 게시물'],['text','T 글만'],['photo','▧ 사진만'],['both','▧ 글과 사진']].map(([v,l])=>`<button class="tile ${S.postType===v?'active':''}" data-action="type:${v}">${l}</button>`).join('')}</div>`;
if(S.postType==='quiz')h+=`<h3>퀴즈 설정</h3>${counter('문제 수','questions',1,30)}<div style="height:12px"></div>${counter('선택지 수','choices',2,6)}<p class="muted">선택지 수는 문제별로 설정할 수 있도록 설계합니다.</p>`;else {if(['post','text','both'].includes(S.postType))h+=`<h3>글 항목 수</h3>${counter('글 항목 수','texts',1,20)}`;if(['post','photo','both'].includes(S.postType))h+=`<h3>사진 항목 수</h3>${counter('사진 항목 수','photos',1,20)}`}
h+=`<h3>공개 콘텐츠</h3><div class="stack"><input class="field" id="title" value="${esc(S.title)}" placeholder="게시물 제목">${['quiz','text','both','post'].includes(S.postType)?`<textarea class="field" id="body" rows="3" placeholder="내용 입력">${esc(S.body)}</textarea>`:''}${btn('게시 및 사용자 화면 보기','publish')}</div><h3>전체 사용자 제어</h3><div class="stack">${btn('전체 입장 허용','admit','secondary')}${btn('모두 대기 화면으로 이동','wait','secondary')}${S.postType==='quiz'?btn(S.revealed?'정답 공개 취소':'퀴즈 정답 공개','reveal','secondary'):''}</div><h3>접속자</h3><div class="notice">${S.users.length?S.users.map(n=>`<div class="row between"><span>● ${esc(n)}</span>${btn('대기 화면으로','kick:'+encodeURIComponent(n),'secondary')}</div>`).join(''):'현재 접속자가 없습니다.'}</div><div class="warn" style="margin-top:18px"><b style="color:#9f3030">전체 종료 및 기록 초기화</b><p class="muted">모든 사용자를 대기 화면으로 보내고 현재 시안의 닉네임·게시물·퀴즈 응답 상태를 초기화합니다.</p>${btn('종료','end','danger')}</div>`}
else if(S.waiting||!S.admitted){h=`<div class="stack" style="text-align:center;justify-items:center"><div style="width:72px;height:72px;background:#e5f4ff;border-radius:50%;display:grid;place-items:center;font-size:34px">⌛</div><h2 style="margin:0">입장 대기 중</h2><p>잠시 대기해 주세요. 곧 입장이 시작됩니다.</p>${!S.entered?`<div class="stack" style="width:100%;text-align:left"><label for="nick"><b>닉네임</b></label><input id="nick" class="field" placeholder="사용할 닉네임 입력" value="${esc(S.nickname)}">${btn('대기하기','enter')}</div>`:`<div class="notice" style="width:100%;text-align:left"><span class="muted">내 닉네임</span><h3 style="margin:4px 0">${esc(S.nickname)}</h3><p class="muted">관리자가 입장을 허용하면 입장할 수 있어.</p></div>${btn('미리보기에서 관리자 열기','goAdmin','secondary')}`}</div>`}
else {h=`<div class="row between"><div><span class="muted">반가워요!</span><h2 style="margin:4px 0">${esc(S.nickname||'방문자')}</h2></div><span class="pill">입장 완료</span></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0">`;
if(S.postType==='quiz'){h+=`<span class="pill">오늘의 퀴즈</span><h2 style="margin-top:12px">${esc(S.title||'퀴즈')}</h2><p>${esc(S.body)}</p>`;for(let i=1;i<=S.questions;i++){h+=`<div class="notice" style="margin:12px 0"><span class="muted">QUESTION ${i} / ${S.questions}</span><h3>${i===1?'다음 중 이음의 핵심 문구는 무엇일까요?':`예시 문제 ${i}`}</h3>${i===1?['나만의 공간, 우리의 연결','모두를 위한 새로운 시작','오늘을 기록하는 공간','함께 만드는 세상'].slice(0,S.choices).map(c=>`<button class="choice ${S.answer===c?'selected':''}" data-action="answer:${encodeURIComponent(c)}" ${S.submitted?'disabled':''}>${esc(c)}</button>`).join(''):'<p class="muted">관리자가 설정한 문제 내용이 표시됩니다.</p>'}</div>`}h+=S.submitted?`<div class="notice"><b>✓ 답변 제출 완료</b><p>제출한 답변: ${esc(S.answer)}</p><p class="muted">한 번 제출한 답변은 수정할 수 없어.</p></div>`:btn('답변 제출하기','submit', '')+(S.answer?'':'');if(S.revealed)h+=`<div class="notice"><b>정답 공개</b><p>나만의 공간, 우리의 연결</p></div>`}
else {h+=`<h2>${esc(S.title||'이음 게시물')}</h2>`;if(['text','both','post'].includes(S.postType))h+=`<p>${esc(S.body)}</p>`;if(['photo','both','post'].includes(S.postType))h+=`<div class="notice" style="text-align:center;padding:48px 10px;font-size:40px">▧<p style="font-size:14px">사진 표시 영역</p><span class="muted" style="font-size:12px">실제 사이트에서는 등록한 사진이 표시됩니다.</span></div>`}}
$('#app').innerHTML=h;}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('#userTab').onclick=()=>{S.view='user';render()};$('#adminTab').onclick=()=>{S.view='admin';render()};document.addEventListener('input',e=>{if(e.target.id==='nick')S.nickname=e.target.value;if(e.target.id==='title')S.title=e.target.value;if(e.target.id==='body')S.body=e.target.value});document.addEventListener('submit',e=>{if(e.target.id==='login'){e.preventDefault();if($('#pw').value==='1314')S.admin=true;else alert('비밀번호가 올바르지 않습니다.');render()}});document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='login'){return}if(a==='enter'){if(!S.nickname.trim())return;S.entered=true;S.waiting=true;render()}else if(a==='goAdmin'){S.view='admin';render()}else if(a.startsWith('type:')){S.postType=a.split(':')[1];render()}else if(a.startsWith('inc:')||a.startsWith('dec:')){let [op,k,m]=a.split(':');S[k]=Math.max(k==='choices'?2:1,Math.min(Number(m),S[k]+(op==='inc'?1:-1)));render()}else if(a==='publish'){if($('#title'))S.title=$('#title').value;if($('#body'))S.body=$('#body').value;S.waiting=false;S.admitted=true;S.entered=true;S.users=S.nickname?[S.nickname]:S.users;S.view='user';render()}else if(a==='admit'){S.waiting=false;S.admitted=true;S.entered=true;S.users=S.nickname?[S.nickname]:S.users;render()}else if(a==='wait'){S.waiting=true;S.admitted=false;S.view='user';render()}else if(a==='reveal'){S.revealed=!S.revealed;render()}else if(a==='answer:'+a.split(':')[1]){if(!S.submitted){S.answer=decodeURIComponent(a.slice(7));render()}}else if(a==='submit'){if(S.answer){S.submitted=true;render()}else alert('답변을 선택해 주세요.')}else if(a==='waitMe'){S.waiting=true;S.admitted=false;render()}else if(a==='end'){if(confirm('모든 사용자와 현재 운영 기록을 초기화할까요?')){S={...S,view:'user',nickname:'',entered:false,admitted:false,waiting:true,admin:false,title:'',body:'',submitted:false,answer:'',revealed:false,ended:true,users:[]};render()}}else if(a==='reset'){S={view:'user',nickname:'',entered:false,admitted:false,waiting:true,admin:false,postType:'quiz',title:'오늘의 퀴즈',body:'우리의 첫 번째 퀴즈에 참여해 보세요!',texts:1,photos:1,questions:3,choices:4,submitted:false,answer:'',revealed:false,ended:false,users:[]};render()}else if(a.startsWith('kick:')){let n=decodeURIComponent(a.slice(5));S.users=S.users.filter(x=>x!==n);if(n===S.nickname){S.waiting=true;S.admitted=false;S.entered=true;S.view='user'}render()}});render();
</script></body></html>
