<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이음 | 나만의 공간, 우리의 연결</title><style>
:root{--sky:#e6f5ff;--blue:#2382bf;--navy:#164e7a;--ink:#203d54;--muted:#66849a;--line:#d6eaf8;--pale:#f4faff;--red:#b83232}*{box-sizing:border-box}body{margin:0;background:#f4f8fb;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:980px;margin:20px auto;padding:0 12px}.shell{background:var(--sky);border:1px solid #c4e5fa;border-radius:22px;padding:18px;box-shadow:0 12px 40px #194b6a12}.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}.logo{width:46px;height:46px;border-radius:14px;background:white;display:grid;place-items:center;color:var(--blue);font-size:25px;font-weight:800}.brand h1{margin:0;color:var(--navy);font-size:26px}.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}.tabs,.row{display:flex;gap:10px;align-items:center}.tabs{margin-bottom:14px}.tabs button{flex:1}.panel{background:#fff;border-radius:16px;padding:20px;border:1px solid var(--line)}h2{color:var(--navy);margin:0 0 14px;font-size:21px}h3{color:var(--navy);margin:18px 0 10px;font-size:16px}.muted{color:var(--muted);font-size:13px}.btn{border:1px solid transparent;border-radius:10px;padding:11px 14px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;font-size:14px}.btn.secondary{background:#fff;border-color:#bfdced;color:var(--navy)}.btn.danger{background:var(--red)}.field{width:100%;padding:12px;border:1px solid #cfe2ef;border-radius:10px;font:inherit;color:var(--ink);background:#fff}.stack{display:grid;gap:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{border:1px solid var(--line);background:#f7fbfe;border-radius:12px;padding:12px;cursor:pointer;color:var(--navy);font-weight:650}.tile.active{background:#d9efff;border-color:var(--blue)}.notice{padding:14px;background:var(--pale);border-radius:12px;margin:10px 0}.choice{display:block;width:100%;text-align:left;background:white;border:1px solid var(--line);border-radius:10px;padding:11px;margin-top:8px;color:var(--navy);cursor:pointer}.choice.selected{border-color:var(--blue);background:#d9efff}.pill{display:inline-block;background:#e5f4ff;color:#2375ac;border-radius:99px;padding:5px 9px;font-size:12px;font-weight:700}.between{justify-content:space-between}.hidden{display:none!important}.stat{background:#edf7ff;border-radius:12px;padding:12px}.stat strong{display:block;color:var(--navy);font-size:22px}.warn{background:#fff4f4;border:1px solid #f4c6c6;border-radius:12px;padding:14px}.line{height:1px;background:var(--line);margin:16px 0}.small{font-size:12px;color:var(--muted)}label{font-weight:650}@media(max-width:540px){.wrap{margin:8px auto;padding:0 7px}.shell{padding:10px}.panel{padding:14px}.grid{grid-template-columns:1fr}.brand h1{font-size:23px}}
</style></head><body><main class="wrap"><div class="shell"><header class="brand"><div class="logo">이음</div><div><h1>이음</h1><p>나만의 공간, 우리의 연결</p></div><span class="pill" id="connection" style="margin-left:auto">연결 중…</span></header><nav class="tabs"><button class="btn" id="userTab">◉ 사용자</button><button class="btn secondary" id="adminTab">▣ 관리자</button></nav><section class="panel" id="app"></section><p class="small">이음 · 실시간 베타</p></div></main><script src="/socket.io/socket.io.js"></script><script>
const socket=io();const $=s=>document.querySelector(s);let state={users:[],post:null,revealed:false,answers:{}},view='user',nickname='',joined=false,admin=false,selected={},submitted=false,localDraft={type:'quiz',title:'오늘의 퀴즈',body:'함께 풀어보세요!',mode:'participate',questions:[{text:'이음의 문구는 무엇인가요?',kind:'choice',choices:['나만의 공간, 우리의 연결','오늘을 기록해요','새로운 시작'],answer:'나만의 공간, 우리의 연결'}]};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const btn=(t,a,c='')=>`<button class="btn ${c}" data-a="${a}">${t}</button>`;const input=(id,label,value='')=>`<label>${label}<input class="field" id="${id}" value="${esc(value)}"></label>`;
socket.on('connect',()=>{$('#connection').textContent='실시간 연결됨';render()});socket.on('disconnect',()=>{$('#connection').textContent='연결 끊김';render()});socket.on('state',s=>{state={...state,...s};render()});socket.on('adminState',s=>{state={...state,...s};render()});socket.on('notice',m=>alert(m));socket.on('adminLoginResult',r=>{if(r.ok){admin=true;render()}else alert(r.message||'로그인 실패')});
$('#userTab').onclick=()=>{view='user';render()};$('#adminTab').onclick=()=>{view='admin';render()};function render(){const app=$('#app');$('#userTab').className='btn '+(view==='user'?'':'secondary');$('#adminTab').className='btn '+(view==='admin'?'':'secondary');let h='';if(view==='admin'&&!admin){h=`<h2>관리자 로그인</h2><p class="muted">관리자 비밀번호를 입력해 주세요.</p><div class="stack"><input class="field" id="pw" type="password" placeholder="관리자 비밀번호"><button class="btn" data-a="login">로그인</button></div>`}
else if(view==='admin'){const users=state.users||[];h=`<h2>관리자 대시보드</h2><div class="grid"><div class="stat">접속 중<strong>${users.length}</strong></div><div class="stat">현재 게시물<strong>${state.post?'1':'0'}</strong></div></div><h3>게시물 유형</h3><div class="grid">${[['quiz','퀴즈/문제'],['post','일반 게시물'],['text','글만'],['photo','사진만'],['both','글과 사진']].map(([v,l])=>`<button class="tile ${localDraft.type===v?'active':''}" data-a="type:${v}">${l}</button>`).join('')}</div>${input('draftTitle','제목',localDraft.title)}<label>내용<textarea id="draftBody" class="field" rows="3">${esc(localDraft.body)}</textarea></label>${localDraft.type==='quiz'?`<label>참여 방식<select id="mode" class="field"><option value="participate" ${localDraft.mode==='participate'?'selected':''}>참여 가능</option><option value="view" ${localDraft.mode==='view'?'selected':''}>보기만 가능</option></select></label><h3>퀴즈 문제</h3><div id="questions">${localDraft.questions.map((q,i)=>`<div class="notice"><label>문제 ${i+1}<input class="field qtext" data-i="${i}" value="${esc(q.text)}"></label><label>유형<select class="field qkind" data-i="${i}"><option value="choice" ${q.kind==='choice'?'selected':''}>객관식</option><option value="text" ${q.kind==='text'?'selected':''}>주관식</option></select></label><label>선택지 (객관식일 때, 쉼표로 구분)<input class="field qchoices" data-i="${i}" value="${esc(q.choices.join(','))}"></label><label>정답(관리자 전용)<input class="field qanswer" data-i="${i}" value="${esc(q.answer)}"></label></div>`).join('')}</div>${btn('문제 추가','addQuestion','secondary')}`:''}<div class="stack" style="margin-top:14px">${btn('게시하기 (이전 게시물 교체)','publish')}${btn('전체 입장 허용','admit','secondary')}${btn('모두 대기 화면으로 이동','wait','secondary')}${state.post&&state.post.type==='quiz'?btn(state.revealed?'정답 공개 취소':'정답 공개','reveal','secondary'):''}</div><h3>접속자 및 답변</h3><div class="notice">${users.length?users.map(u=>`<div class="row between" style="margin:8px 0"><span>${esc(u.nickname||'닉네임 입력 전')} · ${u.admitted?'입장 중':'대기 중'}</span>${btn('대기시키기','kick:'+u.id,'secondary')}</div>`).join(''):'접속자가 없습니다.'}</div>${state.post&&state.post.type==='quiz'?`<h3>퀴즈 제출 현황</h3><div class="notice">${Object.values(state.answers||{}).map(a=>`<p><b>${esc(a.nickname)}</b>: ${a.values.map(esc).join(' / ')}</p>`).join('')||'아직 제출한 답변이 없습니다.'}<p class="small">제출자: ${Object.keys(state.answers||{}).length}명 / 입장한 사용자: ${users.filter(u=>u.admitted).length}명</p></div>`:''}<div class="warn"><b>운영 종료</b><p class="small">모두 대기 상태로 전환하고 현재 게시물과 퀴즈 응답을 메모리에서 지웁니다.</p>${btn('종료 및 현재 데이터 초기화','end','danger')}</div>`}
else {const me=(state.users||[]).find(u=>u.id===socket.id);if(!joined||!nickname){h=`<div style="text-align:center" class="stack"><h2>이음에 입장하기</h2><p>닉네임을 입력하고 입장을 기다려 주세요.</p><input id="nick" class="field" placeholder="사용할 닉네임" maxlength="30" value="${esc(nickname)}">${btn('대기하기','join')}</div>`}else if(!me||!me.admitted){h=`<div style="text-align:center" class="stack"><div style="font-size:40px">⌛</div><h2>입장 대기 중</h2><p>잠시 대기해 주세요. 곧 입장이 시작됩니다.</p><div class="notice"><span class="small">내 닉네임</span><h3>${esc(nickname)}</h3></div></div>`}else if(!state.post){h=`<h2>반가워요, ${esc(nickname)}!</h2><div class="notice">아직 공개된 게시물이 없습니다. 관리자가 게시물을 올리면 여기에 표시됩니다.</div>`}else{const p=state.post;h=`<div class="row between"><h2>${esc(nickname)}</h2><span class="pill">입장 완료</span></div><div class="line"></div><h2>${esc(p.title||'이음 게시물')}</h2><p>${esc(p.body||'')}</p>`;if(p.type==='quiz'){if(p.mode==='view')h+='<div class="notice">이 퀴즈는 보기 전용입니다.</div>';else if(submitted)h+='<div class="notice">답변 제출 완료. 답변은 수정할 수 없습니다.</div>';else{h+=`<div id="userQuestions">${p.questions.map((q,i)=>`<div class="notice"><b>${i+1}. ${esc(q.text)}</b>${q.kind==='text'?`<input class="field answer" data-i="${i}" placeholder="답변 입력">`:q.choices.map(c=>`<button class="choice ${selected[i]===c?'selected':''}" data-a="choose:${i}:${encodeURIComponent(c)}">${esc(c)}</button>`).join('')}</div>`).join('')}</div>${btn('답변 제출하기','submitAnswers')}`}if(state.revealed)h+=`<div class="notice"><b>정답 공개</b>${p.questions.map((q,i)=>`<p>${i+1}. ${esc(q.answer||'관리자가 정답을 설정하지 않았습니다.')}</p>`).join('')}</div>`}if(['photo','both','post'].includes(p.type)&&p.photo)h+=`<img alt="게시물 사진" src="${p.photo}" style="max-width:100%;border-radius:12px">`}}
app.innerHTML=h}
document.addEventListener('input',e=>{if(e.target.id==='nick')nickname=e.target.value;if(e.target.id==='draftTitle')localDraft.title=e.target.value;if(e.target.id==='draftBody')localDraft.body=e.target.value;if(e.target.id==='mode')localDraft.mode=e.target.value;if(e.target.classList.contains('qtext'))localDraft.questions[+e.target.dataset.i].text=e.target.value;if(e.target.classList.contains('qkind'))localDraft.questions[+e.target.dataset.i].kind=e.target.value;if(e.target.classList.contains('qchoices'))localDraft.questions[+e.target.dataset.i].choices=e.target.value.split(',').map(s=>s.trim()).filter(Boolean).slice(0,8);if(e.target.classList.contains('qanswer'))localDraft.questions[+e.target.dataset.i].answer=e.target.value});document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;if(a==='join'){nickname=$('#nick').value.trim();if(nickname){joined=true;socket.emit('join',nickname)}}else if(a==='login')socket.emit('adminLogin',$('#pw').value);else if(a.startsWith('type:')){localDraft.type=a.slice(5);render()}else if(a==='addQuestion'){if(localDraft.questions.length<30)localDraft.questions.push({text:'새 문제',kind:'choice',choices:['선택지 1','선택지 2'],answer:''});render()}else if(a==='publish'){localDraft.title=$('#draftTitle')?.value||'';localDraft.body=$('#draftBody')?.value||'';localDraft.mode=$('#mode')?.value||'participate';socket.emit('adminAction',{action:'publish',post:localDraft});alert('게시물을 공개했어요.');}else if(a==='admit')socket.emit('adminAction',{action:'admitAll'});else if(a==='wait')socket.emit('adminAction',{action:'waitAll'});else if(a==='reveal')socket.emit('adminAction',{action:'reveal'});else if(a==='end'){if(confirm('모든 사용자를 대기시키고 현재 게시물과 퀴즈 응답을 초기화할까요?')){socket.emit('adminAction',{action:'end'});selected={};submitted=false}}else if(a.startsWith('kick:'))socket.emit('adminAction',{action:'kick',id:a.slice(5)});else if(a.startsWith('choose:')){if(!submitted){const [,i,v]=a.split(':');selected[i]=decodeURIComponent(v);render()}}else if(a==='submitAnswers'){const p=state.post;if(!p)return;const vals=p.questions.map((q,i)=>q.kind==='text'?(document.querySelector(`.answer[data-i="${i}"]`)?.value||''):(selected[i]||''));if(vals.some(v=>!v.trim()))return alert('모든 문제에 답변해 주세요.');socket.emit('submitAnswers',vals);submitted=true;render()}});render();
</script></body></html>
